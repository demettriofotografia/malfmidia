<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MALF MIDIA | High-End Production & Strategy</title>

    <!-- Tailwind via CDN (ok para agora) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;700;900&family=Permanent+Marker&family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos globais -->
    <style>
      :root {
        --action: #ff4d00;
        --action-glow: rgba(255, 77, 0, 0.4);
        --bg: #000000;
        --off-white: #eeeeee;
        --text-grey: #615c5a;
      }

      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: var(--off-white);
        overflow-x: hidden;
      }

      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .handwritten {
        font-family: 'Caveat', cursive;
      }
      .marker {
        font-family: 'Permanent Marker', cursive;
      }

      /* Reveal animation */
      .reveal {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
        transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--action);
      }
    </style>

    <!-- CSS do projeto -->



  </head>

  <body>
    <!-- React monta tudo aqui -->
    <div id="root"></div>

    <!-- Entrada correta do Vite -->
    <script type="module" src="/index.tsx"></script>

  </body>
</html>
